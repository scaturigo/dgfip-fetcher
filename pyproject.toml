[project]
name = "dgfip-fetcher"
version = "0.2.0"
description = "Outil de téléchargement automatisé des documents fiscaux depuis impots.gouv.fr"
authors = [
    { name = "Scaturigo", email = "7864575+scaturigo@users.noreply.github.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "playwright>=1.58.0",
    "platformdirs>=4.9.4",
    "keyring>=25.7.0",
    "argcomplete>=3.6.3",
]

[project.urls]
Homepage = "https://github.com/scaturigo/dgfip-fetcher"
Source = "https://github.com/scaturigo/dgfip-fetcher"
Issues = "https://github.com/scaturigo/dgfip-fetcher/issues"

[project.scripts]
dgfip-fetcher = "dgfip_fetcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgfip_fetcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
source = ["dgfip_fetcher"]
# Vérifie que les deux branches de chaque if sont testées
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = [
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "respx>=0.22.0",
]
